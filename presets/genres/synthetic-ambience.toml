# Synthetic ambience: synth textures and melodic drones, no tempo.
id = "synthetic-ambience"
name = "Synthetic ambience"
description = "Synthesizer textures and melodic drones for rooms that don't exist."
template = "{prompt}. Ambient synthesizer soundscape, analog synth drones, slowly modulating textures, shimmering arpeggios far in the background, no drums"
default_prompt = "observation deck of a slow starship"
guidance = 3.0
temperature = 1.05
segment_seconds = 14.0
overlap_seconds = 4.0
crossfade_seconds = 3.0
