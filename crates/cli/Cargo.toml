[package]
name = "driftscape"
description = "Driftscape command line: generate, loop and play ambient soundscapes on your own machine."
version.workspace = true
edition.workspace = true
repository.workspace = true

[[bin]]
name = "driftscape"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
cpal = "0.18.2"
driftscape-core = { path = "../core" }
