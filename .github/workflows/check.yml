# Check every pull request and every push to main: the Rust workspace (format, lints, tests) and the web app (core wasm
# within its size budget, presets, SvelteKit build, tokenizer test). Cloudflare Pages builds and deploys the web app on
# its own (GitHub integration; root directory `web`, build command `npm run build`, output `build`).
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cpal (audio output); the plugin's editor (baseview: X11, XCB, OpenGL); JACK for nih-plug
      - run: >-
          sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libx11-xcb-dev libxcb1-dev
          libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libgl-dev libjack-dev
      - run: rustup toolchain install   # the toolchain from rust-toolchain.toml
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: rustup toolchain install   # with the wasm target, from rust-toolchain.toml
      - run: mise run web
