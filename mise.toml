# Node is pinned here; Rust is pinned in rust-toolchain.toml (with the wasm target), npm packages to exact versions.
[tools]
node = "24"

[tasks.test]
description = "Test the workspace and lint it"
run = ["cargo test --workspace", "cargo clippy --workspace --all-targets -- -D warnings", "cargo fmt --check"]

[tasks.install]
description = "Install the driftscape CLI into ~/.cargo/bin"
run = "cargo install --path crates/cli --locked"

[tasks.web]
description = "Build the web app into web/build (core wasm, presets, ONNX runtimes, then SvelteKit) and test it"
dir = "web"
run = ["npm ci", "npm run build", "npm test"]

[tasks.serve]
description = "Build the web app, embed it in the CLI, and open it with the native engine"
depends = ["web"]
run = "cargo run --release -p driftscape -- serve"

[tasks.deploy]
description = "Deploy a local build by hand (Cloudflare Pages normally builds main itself); needs `wrangler login`"
depends = ["web"]
run = "wrangler pages deploy web/build --project-name driftscape-raskell-io --branch main --commit-hash $(git rev-parse HEAD)"

[tasks.plugin]
description = "Build the DAW plugin (CLAP, VST3, AUv2) into target/bundled; `mise run plugin -- --install` installs it"
run = "crates/plugin/wrap/build.sh"
