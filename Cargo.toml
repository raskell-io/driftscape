# Driftscape: a local AI music engine. A pure core (audio work, no I/O, no model code) shared by every way in:
# the CLI, the DAW plugin, the local web GUI and the hosted PWA (via a C-ABI wasm crate, added in phase 2).
[workspace]
members = ["crates/core", "crates/infer", "crates/cli"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
repository = "https://github.com/raskell-io/driftscape"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# DSP loops are unbearably slow unoptimised; keep debug builds usable for `cargo run`.
[profile.dev.package."*"]
opt-level = 2
[profile.dev]
opt-level = 1
